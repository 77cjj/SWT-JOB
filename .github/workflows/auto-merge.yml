name: Auto Merge

# 机制：PR 带 automerge 标签，且全部 required checks 通过后，自动 squash 合入 master。
# cursor/* 分支的 PR 会自动贴上 automerge（可手动去掉标签以阻止合入）。
#
# 干预：贴/撕标签 = 开/关自动合入；CI 失败 = 不会合入。
# 跳过：draft PR、合入冲突、无权限。

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
  check_suite:
    types: [completed]
  workflow_run:
    workflows:
      - Frontend Build Check
      - Backend Compile Check
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  # 不要 cancel-in-progress：opened 贴标签的 run 会被紧随其后的 ready_for_review 取消，导致永远没标签
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  label-cursor-prs:
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'cursor/') &&
      (github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'ready_for_review' ||
       github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    steps:
      - name: Add automerge label to cursor/* PRs
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['automerge'];
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
            });
            const names = (pr.labels || []).map(l => l.name);
            if (names.includes('no-automerge')) {
              console.log('no-automerge present — not labeling');
              return;
            }
            if (names.includes('automerge')) {
              console.log('automerge label already present');
              return;
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                labels,
              });
              console.log(`Labeled PR #${issue_number} with automerge`);
            } catch (e) {
              if (e.status === 404 || (e.message && e.message.includes('Label does not exist'))) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'automerge',
                  color: '0E8A16',
                  description: 'CI 通过后自动 squash 合入 master',
                }).catch(() => {});
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  labels,
                });
              } else {
                throw e;
              }
            }

  automerge:
    needs: [label-cursor-prs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber && context.payload.workflow_run?.pull_requests?.length) {
              prNumber = context.payload.workflow_run.pull_requests[0].number;
            }
            if (!prNumber && context.payload.check_suite?.pull_requests?.length) {
              prNumber = context.payload.check_suite.pull_requests[0].number;
            }
            if (!prNumber) {
              // workflow_run 有时不带 PR 列表：用 head SHA 反查
              const sha = context.payload.workflow_run?.head_sha
                || context.payload.check_suite?.head_sha;
              if (sha) {
                const { data } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 50,
                });
                const match = data.find(p => p.head.sha === sha);
                prNumber = match?.number;
              }
            }
            if (!prNumber) {
              core.setOutput('skip', 'true');
              console.log('No PR associated with this event');
              return;
            }
            core.setOutput('number', String(prNumber));
            core.setOutput('skip', 'false');

      - name: Squash-merge if labeled and green
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const gateNames = new Set(['build', 'compile']);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

            if (pr.state !== 'open') {
              console.log('PR not open');
              return;
            }
            if (pr.draft) {
              console.log('PR is draft — skip');
              return;
            }
            if (pr.base.ref !== 'master') {
              console.log(`Base is ${pr.base.ref}, only auto-merge to master`);
              return;
            }

            const hasLabel = (pr.labels || []).some(l => l.name === 'automerge');
            if (!hasLabel) {
              console.log('Missing automerge label — skip');
              return;
            }

            // GitHub Actions 的 paths 过滤器对 pull_request 是「相对 base 的整个 PR diff」，
            // 不是最新一个 commit。这里必须用同样的范围，否则会在 compile 还在跑时提前合入。
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const prTouchesFe = files.some(f =>
              f.filename.startsWith('SWT-JOB-Frontend/') ||
              f.filename === 'scripts/check-frontend.sh' ||
              f.filename === '.github/workflows/frontend-build.yml'
            );
            const prTouchesBe = files.some(f =>
              f.filename.startsWith('SWT-JOB-Backend/') ||
              f.filename === '.github/workflows/backend-compile.yml'
            );
            console.log(`PR touchesFe=${prTouchesFe} touchesBe=${prTouchesBe}`);

            // 轮询门禁：workflow_run 仅在默认分支上的 workflow 才会触发，
            // 所以同一次 job 内等待 CI，避免「先跑完 automerge、后跑完 compile」永远合不进去。
            const deadline = Date.now() + 12 * 60 * 1000;
            const appearDeadline = Date.now() + ((prTouchesFe || prTouchesBe) ? 3 * 60 * 1000 : 45 * 1000);
            let ready = false;
            while (Date.now() < deadline) {
              const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (fresh.state !== 'open') {
                console.log('PR closed while waiting');
                return;
              }
              if (fresh.mergeable === false) {
                console.log('PR has conflicts — skip');
                return;
              }
              if (fresh.mergeable === null) {
                console.log('mergeable unknown, waiting...');
                await sleep(10000);
                continue;
              }

              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: fresh.head.sha,
                per_page: 100,
              });
              const gateRuns = (checks.data.check_runs || []).filter(c => gateNames.has(c.name));
              const latestByName = new Map();
              for (const c of gateRuns) {
                const prev = latestByName.get(c.name);
                if (!prev || new Date(c.started_at) > new Date(prev.started_at)) {
                  latestByName.set(c.name, c);
                }
              }
              const latest = [...latestByName.values()];

              const missing = [];
              if (prTouchesFe && !latestByName.has('build')) missing.push('build');
              if (prTouchesBe && !latestByName.has('compile')) missing.push('compile');

              if (missing.length) {
                if (Date.now() < appearDeadline) {
                  console.log(`Waiting for gates to appear: ${missing.join(',')}`);
                  await sleep(10000);
                  continue;
                }
                core.setFailed(`Timed out waiting for CI to start: ${missing.join(',')}`);
                return;
              }

              if (latest.length === 0) {
                console.log('No gate checks required — OK to merge');
                ready = true;
                break;
              }

              const pending = latest.filter(c => c.status !== 'completed');
              if (pending.length) {
                console.log(`Waiting for gates: ${pending.map(c => c.name).join(',')}`);
                await sleep(15000);
                continue;
              }

              const failed = latest.filter(c =>
                c.conclusion !== 'success' && c.conclusion !== 'skipped' && c.conclusion !== 'neutral'
              );
              if (failed.length > 0) {
                console.log(`Checks failed: ${failed.map(c => `${c.name}=${c.conclusion}`).join(', ')}`);
                return;
              }

              ready = true;
              break;
            }

            if (!ready) {
              core.setFailed('Timed out waiting for CI gates');
              return;
            }

            const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            console.log(`Merging PR #${prNumber} (${fresh.title})`);
            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: `${fresh.title} (#${prNumber})`,
              });
              console.log('Merged successfully');

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${fresh.head.ref}`,
                });
                console.log(`Deleted branch ${fresh.head.ref}`);
              } catch (e) {
                console.log(`Could not delete branch: ${e.message}`);
              }
            } catch (e) {
              console.log(`Merge failed: ${e.message}`);
              core.setFailed(e.message);
            }
